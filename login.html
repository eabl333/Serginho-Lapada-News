<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lapada News</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-15477657576"></script>
    <script>
     window.dataLayer = window.dataLayer || [];
     function gtag(){dataLayer.push(arguments);}
     gtag('js', new Date());
     gtag('config', 'G-15477657576');
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            padding: 20px;
        }

        .login-box {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-box h1 {
            color: #E10600;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #666;
            margin-bottom: 30px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .login-box input:focus {
            border-color: #E10600;
            outline: none;
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            background: #E10600;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        .login-box button:hover {
            background: #0B0B0B;
        }

        .login-box button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        #msg.erro {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        #msg.sucesso {
            background: #d4edda;
            color: #155724;
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>📰 Lapada News</h1>
        <p>Painel Administrativo</p>

        <form id="login-form" autocomplete="on">
            <input 
                type="email" 
                id="email" 
                placeholder="Email" 
                autocomplete="email"
                required
            >
            <input 
                type="password" 
                id="senha" 
                placeholder="Senha" 
                autocomplete="current-password"
                required
            >
            <button type="submit" id="btn-login">Entrar</button>
        </form>

        <div id="msg"></div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const btnLogin = document.getElementById('btn-login');
        const msgDiv = document.getElementById('msg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnLogin.disabled = true;
            msgDiv.style.display = 'none';

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });

                if (error) {
                    throw error;
                }

                msgDiv.textContent = 'Login bem-sucedido! Redirecionando...';
                msgDiv.className = 'sucesso';
                msgDiv.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1500);
            } catch (err) {
                msgDiv.textContent = 'Erro ao fazer login: ' + err.message;
                msgDiv.className = 'erro';
                msgDiv.style.display = 'block';
            } finally {
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
