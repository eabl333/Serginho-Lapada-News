<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoria - Serginho Lapada</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f4; color: #0B0B0B; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        .header-page {
            border-bottom: 3px solid #E10600;
            padding-bottom: 15px;
            margin: 30px 0;
        }
        .header-page h1 { font-size: 2.5rem; }

        .card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 18px;
            transition: all 0.3s ease;
        }
        .card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.15); transform: translateY(-3px); }
        .card-img {
            height: 200px;
            background: linear-gradient(135deg, #2d2d3f, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        .card-body { padding: 20px; }
        .card h3 { font-size: 1.2rem; margin-bottom: 5px; }
        .card .meta { display: flex; gap: 15px; font-size: 13px; color: #666; margin-top: 10px; }
        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }
        .badge-policia { background: #c0392b; }
        .badge-politica { background: #2980b9; }
        .badge-cidades { background: #27ae60; }
        .badge-esportes { background: #f39c12; }
        .badge-geral { background: #7f8c8d; }
        .loading { text-align: center; padding: 40px; color: #999; }

        .btn-voltar {
            display: inline-block;
            background: #0B0B0B;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            margin-bottom: 20px;
        }
        .btn-voltar:hover { background: #E10600; }
    </style>
</head>
<body>

    <div class="container" style="padding-top:30px; padding-bottom:30px;">
        <a href="index.html" class="btn-voltar">← Voltar para o início</a>

        <div class="header-page">
            <h1 id="tituloCategoria">📂 Categoria</h1>
        </div>

        <div id="listaNoticiasCategoria">
            <div class="loading">⏳ Carregando notícias...</div>
        </div>
    </div>

    <script>
        async function carregarCategoria() {
            const params = new URLSearchParams(window.location.search);
            const categoria = params.get('cat') || 'Geral';
            const emojis = {
                'Polícia': '🚔',
                'Política': '🏛️',
                'Cidades': '🌆',
                'Esportes': '⚽',
                'Comunidade': '🤝',
                'Entretenimento': '🎭',
                'Geral': '📂'
            };
            document.getElementById('tituloCategoria').textContent = `${emojis[categoria] || '📂'} ${categoria}`;

            const container = document.getElementById('listaNoticiasCategoria');
            container.innerHTML = '<div class="loading">⏳ Carregando...</div>';

            try {
                const { data, error } = await supabaseClient
                    .from('noticias')
                    .select('*')
                    .eq('categoria', categoria)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:40px; color:#999;">📭 Nenhuma notícia na categoria <strong>${categoria}</strong></div>`;
                    return;
                }

                container.innerHTML = data.map(not => `
                    <div class="card">
                        <div class="card-img" style="${not.imagem_url ? `background-image:url('${not.imagem_url}'); background-size:cover; background-position:center;` : ''}">
                            ${!not.imagem_url ? '📰' : ''}
                        </div>
                        <div class="card-body">
                            <span class="badge badge-${(not.categoria || 'geral').toLowerCase()}">${not.categoria || 'Geral'}</span>
                            <h3><a href="${not.link_externo || 'noticia.html?id=' + not.id}" ${not.link_externo ? 'target="_blank"' : ''} style="text-decoration:none; color:#0B0B0B;">${not.titulo}</a></h3>
                            <p style="color:#666;">${not.resumo}</p>
                            <div class="meta">
                                <span>✍️ ${not.autor || 'Serginho Lapada'}</span>
                                <span>🕐 ${not.Tempo || 'agora'}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = `<div style="color:red;">❌ Erro: ${error.message}</div>`;
            }
        }
        carregarCategoria();
    </script>
</body>
</html>
